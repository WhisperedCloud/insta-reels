name: Instagram Reels

# Two accounts, 2 Reels a day each. Posting times live in reels/slots.py.
# Three triggers before each slot (80, 40 and 12 minutes ahead); see slots.py for why.
# Kept light on purpose: the repo is private, so GitHub minutes are limited.
on:
  schedule:
    - cron: '10,50 12 * * *'   # quiz 13:30
    - cron: '18 13 * * *'
    - cron: '10,50 22 * * *'   # quiz 23:30
    - cron: '18 23 * * *'
    - cron: '10,50 0 * * *'    # stoic 01:30
    - cron: '18 1 * * *'
    - cron: '40 14 * * *'      # stoic 16:00
    - cron: '20,48 15 * * *'
  workflow_dispatch:
    inputs:
      account:
        description: 'Which account'
        type: choice
        options: [both, quiz, stoic]
        default: both
      dry_run:
        description: 'Only render and save (do not post)'
        type: boolean
        default: true

concurrency:
  group: instagram-reels
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Is there anything to do?
        id: due
        env:
          HAS_QUIZ: ${{ secrets.IG_TOKEN_QUIZ != '' }}
          HAS_STOIC: ${{ secrets.IG_TOKEN_STOIC != '' }}
          WANTED: ${{ inputs.account }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python3 reels/slots.py quiz stoic | tee -a "$GITHUB_OUTPUT"
          elif [ "$WANTED" = "both" ]; then
            echo "accounts=quiz stoic" >> "$GITHUB_OUTPUT"
          else
            echo "accounts=$WANTED" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.due.outputs.accounts != ''
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: reels/requirements.txt

      - name: Install
        if: steps.due.outputs.accounts != ''
        run: pip install -q -r reels/requirements.txt

      - name: Make and post Reel
        if: steps.due.outputs.accounts != ''
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          IG_TOKEN_QUIZ: ${{ secrets.IG_TOKEN_QUIZ }}
          IG_TOKEN_STOIC: ${{ secrets.IG_TOKEN_STOIC }}
          IG_HANDLE_QUIZ: ${{ vars.IG_HANDLE_QUIZ }}
          IG_HANDLE_STOIC: ${{ vars.IG_HANDLE_STOIC }}
          IG_MUSIC: ${{ vars.IG_MUSIC }}
          RUN_MODE: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          OUT_DIR: reels_output
        run: |
          status=0
          for a in ${{ steps.due.outputs.accounts }}; do
            python reels/main.py "$a" || status=1
          done
          exit $status

      - name: Save Reel for review
        if: always() && steps.due.outputs.accounts != ''
        uses: actions/upload-artifact@v4
        with:
          name: reels-${{ github.run_number }}
          path: |
            reels_output/*.mp4
            reels_output/*.txt
          retention-days: 3
          if-no-files-found: ignore

      - name: Keep the Instagram token fresh
        if: always() && steps.due.outputs.accounts != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          for a in quiz stoic; do
            f="reels_output/new_token_$a.secret"
            if [ -s "$f" ]; then
              if [ -n "$GH_TOKEN" ]; then
                gh secret set "IG_TOKEN_$(echo "$a" | tr a-z A-Z)" -R "${{ github.repository }}" < "$f" && echo "Renewed token for $a"
              else
                echo "::warning::Add a GH_PAT secret so the $a Instagram token renews itself (otherwise it expires after 60 days)."
              fi
              rm -f "$f"
            fi
          done

      - name: Remember what was posted
        if: always() && steps.due.outputs.accounts != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reels/used_*.txt reels/posted_*.txt 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "chore: update reels trackers [skip ci]"
            for i in 1 2 3 4; do git pull --rebase -q && git push -q && break; sleep 7; done
          fi
